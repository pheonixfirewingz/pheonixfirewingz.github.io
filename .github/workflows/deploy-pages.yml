name: Build and deploy Angular site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular site
        run: npm run build -- --base-href "/"

      - name: Locate static build output
        shell: bash
        run: |
          BUILD_DIR="$(find dist -type f -name index.html -printf '%h\n' | head -n 1)"

          if [[ -z "$BUILD_DIR" ]]; then
            echo "Could not find index.html under dist/"
            exit 1
          fi

          touch "$BUILD_DIR/.nojekyll"

          # GitHub Pages has no SPA fallback/rewrite rule.
          # Copy index.html so direct Angular routes still load the app.
          cp "$BUILD_DIR/index.html" "$BUILD_DIR/404.html"

          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.BUILD_DIR }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
